[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "efootball-analytics"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7,<7", "mss>=10.2,<11", "pynput>=1.7.7,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.gui-scripts]
efootball-analytics = "efootball_analytics.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
